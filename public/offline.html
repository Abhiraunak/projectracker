<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>projecTracker: offline</title>
    <meta name="theme-color" content="#ffffff">
    <style>
        :root {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #fafaf9;
            color: #1c1917;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        main {
            max-width: 360px;
            text-align: center;
        }

        img {
            width: 72px;
            height: 72px;
            border-radius: 16px;
        }

        h1 {
            font-size: 20px;
            margin: 20px 0 8px;
        }

        p {
            margin: 0;
            color: #57534e;
            line-height: 1.5;
        }

        button {
            margin-top: 24px;
            min-height: 44px;
            padding: 0 20px;
            border: 0;
            border-radius: 8px;
            background: #1c1917;
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <main>
        <img src="/icons/icon-192.png" alt="">
        <h1>You're offline</h1>
        <p>projecTracker needs the internet to load your projects. Check your connection and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>

</html>
